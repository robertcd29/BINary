<!doctype html>
<html lang="ro">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BINary · Dispecerat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        /* Stilul comun BINary (acelasi si in aplicatia lui Mihai) */
        :root {
            --asfalt: #23302a;
            /* text, iconite */
            --asfalt-2: #5d6b63;
            /* text secundar */
            --hartie: #eef1ec;
            /* fundal */
            --panou: #ffffff;
            --linie: #d9dfd9;
            --vesta: #ff6a13;
            /* actiunea principala + depozitari ilegale */
            --ok: #2f8f5b;
            /* pubela sub 60% */
            --atentie: #e3a21a;
            /* 60-85% */
            --plin: #c73e2a;
            /* peste 85% */
            --font: "Barlow", system-ui, sans-serif;
            --font-cifre: "Barlow Condensed", "Barlow", system-ui, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            height: 100%;
        }

        body {
            font-family: var(--font);
            font-size: 15px;
            line-height: 1.45;
            color: var(--asfalt);
            background: var(--hartie);
            display: grid;
            grid-template-columns: 1fr 380px;
            height: 100vh;
        }

        button {
            font: inherit;
        }

        :focus-visible {
            outline: 3px solid var(--vesta);
            outline-offset: 2px;
        }

        /* ---------- harta ---------- */
        #harta {
            height: 100%;
            background: #dfe4de;
        }

        .leaflet-container {
            font-family: var(--font);
        }

        /* harta de fundal in gri, ca pubelele si rutele sa iasa in fata */
        .leaflet-tile-pane {
            filter: grayscale(1) contrast(.85) brightness(1.06);
        }

        .legenda {
            background: var(--panou);
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid var(--linie);
            font-size: 13px;
            line-height: 1.9;
        }

        .legenda .rand {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* pubela ca indicator de umplere: elementul care se tine minte */
        .pubela {
            width: 14px;
            height: 19px;
            border: 2px solid var(--asfalt);
            border-radius: 2px 2px 4px 4px;
            background: var(--panou);
            position: relative;
            overflow: hidden;
        }

        .pubela::before {
            /* capacul */
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--asfalt);
            z-index: 1;
        }

        .pubela i {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
        }

        .pubela.reala {
            width: 20px;
            height: 27px;
            box-shadow: 0 0 0 3px var(--panou), 0 0 0 5px var(--asfalt);
        }

        .pubela.simulata {
            opacity: .45;
        }

        /* pe harta, pubelele se micsoreaza cand dai zoom out (vezi scalaPubele) */
        .leaflet-marker-icon .pubela {
            transform: scale(var(--scara-pubela, 1));
            transform-origin: 50% 100%;
        }

        .info-pubela b {
            display: block;
            font-size: 15px;
        }

        .info-pubela span {
            display: block;
            color: var(--asfalt-2);
        }

        .depozitare {
            width: 16px;
            height: 16px;
            background: var(--vesta);
            border: 2px solid var(--asfalt);
            transform: rotate(45deg);
        }

        .depozitare.colectata {
            background: var(--panou);
        }

        .depou {
            width: 22px;
            height: 22px;
            background: var(--asfalt);
            color: var(--panou);
            border-radius: 4px;
            display: grid;
            place-items: center;
            font: 700 13px var(--font-cifre);
        }

        .camion-live {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 3px solid var(--panou);
            box-shadow: 0 0 0 2px var(--asfalt);
            color: #fff;
            display: grid;
            place-items: center;
            font: 700 15px var(--font-cifre);
        }

        .depozitare-poza {
            display: block;
            width: 220px;
            height: 140px;
            object-fit: cover;
            border-radius: 4px;
            margin-top: 6px;
        }

        /* ---------- panoul lateral ---------- */
        aside {
            background: var(--panou);
            border-left: 1px solid var(--linie);
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        header {
            padding: 20px 22px 16px;
        }

        .marca {
            font: 700 30px/1 var(--font-cifre);
            letter-spacing: -0.01em;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .marca .pubela {
            width: 18px;
            height: 24px;
        }

        .azi {
            color: var(--asfalt-2);
            margin: 6px 0 0;
        }

        .rezumat {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            border-top: 1px solid var(--linie);
            border-bottom: 1px solid var(--linie);
        }

        .rezumat div {
            padding: 12px 22px;
        }

        .rezumat div+div {
            border-left: 1px solid var(--linie);
        }

        .rezumat b {
            display: block;
            font: 600 28px/1.05 var(--font-cifre);
        }

        .rezumat span {
            font-size: 13px;
            color: var(--asfalt-2);
        }

        .rezumat .alarma b {
            color: var(--plin);
        }

        .actiune {
            padding: 16px 22px;
        }

        #planifica {
            width: 100%;
            padding: 13px 16px;
            border: 0;
            border-radius: 6px;
            background: var(--vesta);
            color: #1a1205;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
        }

        #planifica:hover {
            background: #ff7d33;
        }

        #planifica:disabled {
            opacity: .6;
            cursor: progress;
        }

        #status {
            margin: 8px 0 0;
            font-size: 13px;
            color: var(--asfalt-2);
            min-height: 1.45em;
        }

        #status.eroare {
            color: var(--plin);
        }

        .derulare {
            overflow-y: auto;
            flex: 1;
            min-height: 0;
        }

        section {
            padding: 4px 22px 18px;
        }

        h2 {
            font: 600 19px/1.2 var(--font-cifre);
            margin: 12px 0 8px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        h2 small {
            font: 400 13px var(--font);
            color: var(--asfalt-2);
        }

        ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .camion {
            display: grid;
            grid-template-columns: 6px 1fr auto;
            gap: 4px 12px;
            padding: 10px 0;
            border-top: 1px solid var(--linie);
        }

        .camion .culoare {
            grid-row: span 2;
            border-radius: 3px;
        }

        .camion b {
            font-weight: 600;
        }

        .camion .km {
            font: 600 18px/1 var(--font-cifre);
            text-align: right;
        }

        .camion .detalii {
            grid-column: 2 / 4;
            font-size: 13px;
            color: var(--asfalt-2);
        }

        .raport {
            display: grid;
            grid-template-columns: 64px 1fr;
            gap: 12px;
            padding: 12px 0;
            border-top: 1px solid var(--linie);
            cursor: pointer;
            width: 100%;
            text-align: left;
            background: none;
            border-left: 0;
            border-right: 0;
            border-bottom: 0;
            color: inherit;
        }

        .raport:hover .titlu {
            text-decoration: underline;
        }

        .raport .miniatura {
            width: 64px;
            height: 64px;
            border-radius: 4px;
            object-fit: cover;
            background: var(--hartie);
            display: grid;
            place-items: center;
            font: 600 13px var(--font-cifre);
            color: var(--asfalt-2);
        }

        .raport .titlu {
            font-weight: 600;
        }

        .raport p {
            margin: 2px 0 6px;
            font-size: 14px;
        }

        .eticheta {
            display: inline-block;
            font-size: 12px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 99px;
            background: var(--hartie);
        }

        .eticheta.asignata {
            background: #fff0e6;
            color: #a8410a;
        }

        .eticheta.colectata {
            background: #e5f2ea;
            color: var(--ok);
        }

        .eticheta.respinsa {
            background: #f8e5e2;
            color: var(--plin);
        }

        .cand {
            font-size: 12px;
            color: var(--asfalt-2);
            margin-left: 6px;
        }

        .eveniment {
            padding: 9px 0 9px 12px;
            border-top: 1px solid var(--linie);
            border-left: 3px solid var(--vesta);
            font-size: 14px;
        }

        .eveniment.linistit {
            border-left-color: var(--ok);
        }

        .eveniment time {
            display: block;
            font-size: 12px;
            color: var(--asfalt-2);
        }

        .eveniment.nou {
            animation: aprinde 2.5s ease-out;
        }

        @keyframes aprinde {
            from {
                background: #ffe3d1;
            }

            to {
                background: transparent;
            }
        }

        .gol {
            color: var(--asfalt-2);
            font-size: 14px;
            padding: 10px 0;
            border-top: 1px solid var(--linie);
        }

        @media (max-width: 860px) {
            body {
                grid-template-columns: 1fr;
                grid-template-rows: 55vh auto;
                height: auto;
            }

            aside {
                border-left: 0;
                border-top: 1px solid var(--linie);
            }

            .derulare {
                overflow: visible;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
                animation: none !important;
            }
        }
    </style>
</head>

<body>
    <div id="harta" role="application" aria-label="Harta pubelelor și a rutelor"></div>

    <aside>
        <header>
            <h1 class="marca"><span class="pubela" aria-hidden="true"><i
                        style="height:70%;background:var(--vesta)"></i></span>BINary</h1>
            <p class="azi" id="azi">Timișoara</p>
        </header>

        <div class="rezumat" aria-live="polite">
            <div class="alarma"><b id="nr-pline">–</b><span>ghene de golit azi</span></div>
            <div><b id="nr-depozitari">–</b><span>depozitări de ridicat</span></div>
            <div><b id="km-total">–</b><span>km planificați</span></div>
        </div>

        <div class="actiune">
            <button id="planifica">Planifică rutele de azi</button>
            <p id="status" role="status">Se încarcă planul curent…</p>
        </div>

        <div class="derulare">
            <section>
                <h2>În timp real <small>de la senzori</small></h2>
                <ul id="evenimente"></ul>
            </section>
            <section>
                <h2>Camioane <small id="nr-camioane"></small></h2>
                <ul id="camioane"></ul>
            </section>
            <section>
                <h2>Depozitări ilegale <small>cele mai noi sus</small></h2>
                <ul id="rapoarte"></ul>
            </section>
        </div>
    </aside>

    <script>
        const REIMPROSPATARE_MS = 5000;
        const CULORI_CAMIOANE = ["#2563c9", "#7a3fb0", "#0f8a8a", "#b5487a", "#5b6b1f"];
        const STARE = {
            deschisa: "În așteptare",
            asignata: "Pe rută",
            colectata: "Colectată",
            respinsa: "Nu încape azi",
        };

        // ---------- harta ----------
        const harta = L.map("harta", { zoomControl: false }).setView([45.7537, 21.2257], 13);
        L.control.zoom({ position: "topleft" }).addTo(harta);

        // pubele mai mici la zoom out: marime normala de la zoom 16, -15% pe nivel, minim 40%
        function scalaPubele() {
            const s = Math.max(0.4, Math.min(1, 1 - (16 - harta.getZoom()) * 0.15));
            harta.getContainer().style.setProperty("--scara-pubela", s);
        }
        harta.on("zoomend", scalaPubele);
        scalaPubele();
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: "© OpenStreetMap", maxZoom: 19,
        }).addTo(harta);

        const stratRute = L.layerGroup().addTo(harta);
        const stratPubele = L.layerGroup().addTo(harta);
        const stratDepozitari = L.layerGroup().addTo(harta);
        const stratCamioane = L.layerGroup().addTo(harta);
        const markeriDepozitari = {};
        let primaIncarcare = true;

        const legenda = L.control({ position: "bottomleft" });
        legenda.onAdd = () => {
            const d = L.DomUtil.create("div", "legenda");
            d.innerHTML = `
                <div class="rand"><span class="pubela"><i style="height:35%;background:var(--ok)"></i></span>Umplere sub 60%</div>
                <div class="rand"><span class="pubela"><i style="height:72%;background:var(--atentie)"></i></span>60–85%</div>
                <div class="rand"><span class="pubela"><i style="height:92%;background:var(--plin)"></i></span>Peste 85%</div>
                <div class="rand"><span class="pubela reala" style="margin:0 3px"><i style="height:50%;background:var(--ok)"></i></span>Ghenă reală, cu adresă</div>
                <div class="rand"><span class="depozitare" style="margin:0 2px"></span>Depozitare ilegală</div>`;
            return d;
        };
        legenda.addTo(harta);

        function culoareUmplere(p) {
            return p >= 85 ? "var(--plin)" : p >= 60 ? "var(--atentie)" : "var(--ok)";
        }

        function iconPubela(umplere, reala) {
            const p = Math.max(0, Math.min(100, Math.round(umplere ?? 0)));
            const [w, h] = reala ? [20, 27] : [14, 19];
            return L.divIcon({
                className: "",
                html: `<div class="pubela ${reala ? "reala" : "simulata"}"><i style="height:${p}%;background:${culoareUmplere(p)}"></i></div>`,
                iconSize: [w, h], iconAnchor: [w / 2, h], tooltipAnchor: [w / 2 + 2, -h / 2],
            });
        }

        // ---------- date ----------
        async function cere(metoda, url) {
            const r = await fetch(url, { method: metoda });
            if (!r.ok) throw new Error(`${r.status} la ${url}`);
            return r.json();
        }

        async function pubele() {
            try {
                return await cere("GET", "/api/pubele");          // toate pubelele (reale + simulate)
            } catch {
                return (await cere("GET", "/api/pubele-fizice")).map(p => ({ ...p, reala: true }));
            }
        }

        function element(tag, clasa, text) {
            const e = document.createElement(tag);
            if (clasa) e.className = clasa;
            if (text !== undefined) e.textContent = text;
            return e;
        }

        function timpTrecut(iso) {
            const min = Math.round((Date.now() - new Date(iso)) / 60000);
            if (min < 1) return "acum";
            if (min < 60) return `acum ${min} min`;
            const ore = Math.round(min / 60);
            return ore < 24 ? `acum ${ore} h` : new Date(iso).toLocaleDateString("ro-RO");
        }

        const numeCamion = t => `Camion ${t + 1}`;

        // ---------- desenare ----------
        function deseneazaRute(plan) {
            deseneazaEvenimente(plan.evenimente);
            stratRute.clearLayers();
            plan.routes.forEach((r, i) => {
                const culoare = CULORI_CAMIOANE[i % CULORI_CAMIOANE.length];
                L.polyline(r.geometry, { color: "#fff", weight: 8, opacity: .9 }).addTo(stratRute);
                L.polyline(r.geometry, { color: culoare, weight: 4 })
                    .bindTooltip(`${numeCamion(r.truck)}: ${(r.distance_m / 1000).toFixed(1)} km`, { sticky: true })
                    .addTo(stratRute);
            });
            const depou = plan.routes[0]?.geometry[0];
            if (depou) {
                L.marker(depou, { icon: L.divIcon({ className: "", html: '<div class="depou">D</div>', iconSize: [22, 22] }) })
                    .bindTooltip("Depoul, de aici pleacă toate camioanele").addTo(stratRute);
            }

            const lista = document.getElementById("camioane");
            lista.replaceChildren();
            plan.routes.forEach((r, i) => {
                const li = element("li", "camion");
                const bara = element("span", "culoare");
                bara.style.background = CULORI_CAMIOANE[i % CULORI_CAMIOANE.length];
                const opriri = r.stops.filter(s => s !== "depot").length;
                li.append(bara, element("b", "", numeCamion(r.truck)),
                    element("span", "km", `${(r.distance_m / 1000).toFixed(1)} km`),
                    element("span", "detalii", `${opriri} opriri, ${Math.round(r.load_l).toLocaleString("ro-RO")} L de ridicat`));
                lista.append(li);
            });
            document.getElementById("nr-camioane").textContent = `${plan.routes.length} pe traseu`;
            document.getElementById("km-total").textContent = (plan.total_distance_m / 1000).toFixed(1);
        }

        const numePubele = {};      // id -> nume, pentru fluxul de evenimente

        function deseneazaPubele(lista) {
            stratPubele.clearLayers();
            lista.forEach(p => { numePubele[p.id] = p.nume || p.id; });
            lista.forEach(p => {
                const m = L.marker([p.lat, p.lng ?? p.lon], {
                    icon: iconPubela(p.umplere, p.reala),
                    zIndexOffset: p.reala ? 1000 : 0,          // ghenele reale deasupra celor simulate
                });
                if (p.reala) {
                    const info = element("div", "info-pubela");
                    info.append(element("b", "", p.nume || p.id),
                        element("span", "", p.adresa || "Adresă necunoscută"),
                        element("span", "", `Umplere: ${Math.round(p.umplere ?? 0)}%`));
                    if (p.pe_ruta_posibil === false)
                        info.append(element("span", "", "Prea departe de o stradă din hartă: nu poate fi pusă pe rută"));
                    m.bindTooltip(info);
                } else {
                    m.bindTooltip(`Pubelă simulată ${p.id}: ${Math.round(p.umplere ?? 0)}%`);
                }
                m.addTo(stratPubele);
            });
            document.getElementById("nr-pline").textContent = lista.filter(p => p.umplere > 0).length;
        }

        function deseneazaDepozitari(alerte) {
            stratDepozitari.clearLayers();
            const lista = document.getElementById("rapoarte");
            lista.replaceChildren();
            const deRidicat = alerte.filter(a => a.status !== "colectata");
            document.getElementById("nr-depozitari").textContent = deRidicat.length;

            if (!alerte.length) {
                lista.append(element("li", "gol", "Nicio depozitare raportată azi. Rapoartele cetățenilor și ale camerelor apar aici."));
                return;
            }

            alerte.forEach(a => {
                const dinCetatean = a.sursa === "cetatean";
                const titlu = dinCetatean ? "Raportată de un cetățean" : `Camera ${a.camera_id ?? ""}`.trim();
                const stare = a.status === "asignata" && a.camion != null
                    ? `Pe ruta camionului ${a.camion + 1}` : (STARE[a.status] ?? a.status);

                // marker pe harta
                const m = L.marker([a.lat, a.lng], {
                    icon: L.divIcon({ className: "", html: `<div class="depozitare${a.status === "colectata" ? " colectata" : ""}"></div>`, iconSize: [16, 16] }),
                }).addTo(stratDepozitari);
                const popup = element("div");
                popup.append(element("b", "", `${titlu} (${a.id})`), element("div", "", stare));
                if (a.descriere) popup.append(element("div", "", a.descriere));
                if (dinCetatean) {
                    const img = element("img", "depozitare-poza");
                    img.src = `/captures/${a.id}.jpg`;
                    img.alt = "Poza trimisă de cetățean";
                    img.onerror = () => img.remove();
                    popup.append(img);
                }
                m.bindPopup(popup);
                markeriDepozitari[a.id] = m;

                // rand in lista
                const li = element("li");
                const buton = element("button", "raport");
                buton.onclick = () => { harta.flyTo([a.lat, a.lng], 16); m.openPopup(); };
                let mini;
                if (dinCetatean) {
                    mini = element("img", "miniatura");
                    mini.src = `/captures/${a.id}.jpg`;
                    mini.alt = "";
                    mini.onerror = () => mini.replaceWith(element("span", "miniatura", "Fără poză"));
                } else {
                    mini = element("span", "miniatura", "Cameră");
                }
                const text = element("div");
                const rand = element("div");
                rand.append(element("span", `eticheta ${a.status}`, stare), element("span", "cand", timpTrecut(a.creata)));
                text.append(element("div", "titlu", titlu));
                text.append(element("p", "", a.descriere || `Mărime estimată: ${a.marime ?? "medie"}`
                    + (a.nr_raportari > 1 ? `, raportată de ${a.nr_raportari} ori` : "")));
                text.append(rand);
                buton.append(mini, text);
                li.append(buton);
                lista.append(li);
            });
        }

        // ---------- camioanele, din GPS-ul aplicatiei soferului ----------
        function deseneazaCamioane(pozitii) {
            stratCamioane.clearLayers();
            pozitii.forEach(p => {
                const culoare = CULORI_CAMIOANE[p.camion % CULORI_CAMIOANE.length];
                const secunde = Math.round((Date.now() - new Date(p.la)) / 1000);
                const cand = secunde < 60 ? `acum ${secunde} s` : `acum ${Math.round(secunde / 60)} min`;
                L.marker([p.lat, p.lng], {
                    icon: L.divIcon({
                        className: "",
                        html: `<div class="camion-live" style="background:${culoare}">${p.camion + 1}</div>`,
                        iconSize: [30, 30],
                    }),
                    zIndexOffset: 2000,
                }).bindTooltip(`${numeCamion(p.camion)}, poziție GPS ${cand}`).addTo(stratCamioane);
            });
        }

        // ---------- evenimente de la senzori ----------
        const vazute = new Set();
        let primeleEvenimente = true;

        function textEveniment(e) {
            const nume = numePubele[e.id] || e.id;
            if (e.status === "golita") return [`${nume} a fost golită.`, true];
            if (e.status === "citire") return [`${nume}: umplere ${e.inainte}% → ${e.umplere}%.`, e.umplere < 85];
            if (e.status === "assigned") return [`${nume} are deșeuri și a fost adăugată pe ruta camionului ${e.truck + 1}`
                + (e.extra_m ? ` (+${(e.extra_m / 1000).toFixed(1)} km).` : "."), false];
            if (e.status === "pending") return [`${nume} are deșeuri, dar niciun camion nu mai are loc azi.`, false];
            if (e.status === "rejected") return [`${nume} are deșeuri, dar nu poate fi adăugată pe o rută (${e.reason}).`, false];
            if (e.reason === "e deja pe o ruta") return [`${nume} are deșeuri. E deja pe ruta de azi.`, true];
            if (e.status === "urgenta") return [`${nume} are deșeuri. Intră în primul plan calculat.`, false];
            return [`${nume}: ${e.status}`, true];
        }

        function deseneazaEvenimente(evenimente = []) {
            const lista = document.getElementById("evenimente");
            lista.replaceChildren();
            if (!evenimente.length) {
                lista.append(element("li", "gol", "Nimic nou încă. Orice schimbare de umplere a unei ghene sau o golire apare aici."));
                return;
            }
            [...evenimente].reverse().slice(0, 6).forEach(e => {
                const cheie = `${e.id}|${e.status}|${e.la}`;
                const [text, linistit] = textEveniment(e);
                const li = element("li", `eveniment${linistit ? " linistit" : ""}`);
                if (!primeleEvenimente && !vazute.has(cheie)) li.classList.add("nou");
                vazute.add(cheie);
                const cand = element("time", "", new Date(e.la).toLocaleTimeString("ro-RO", { hour: "2-digit", minute: "2-digit" }));
                li.append(cand, element("span", "", text));
                lista.append(li);
            });
            primeleEvenimente = false;
        }

        // ---------- reimprospatare ----------
        let ruteInCurs = false;     // cererea pentru rute poate dura cat se calculeaza planul
        let areRute = false;

        function ora() {
            return new Date().toLocaleTimeString("ro-RO", { hour: "2-digit", minute: "2-digit" });
        }

        async function actualizeaza(plan) {
            // pubelele si depozitarile apar imediat; rutele vin separat, cand sunt gata
            const [p, alerte, pozitii] = await Promise.all([
                pubele(), cere("GET", "/api/alerte"), cere("GET", "/api/pozitii").catch(() => []),
            ]);
            deseneazaPubele(p);
            deseneazaDepozitari(alerte);
            deseneazaCamioane(pozitii);
            if (primaIncarcare && p.length) {
                harta.fitBounds(p.map(x => [x.lat, x.lng ?? x.lon]), { padding: [40, 40] });
                primaIncarcare = false;
            }

            if (plan) {
                deseneazaRute(plan);
                areRute = true;
            } else if (!ruteInCurs) {
                ruteInCurs = true;
                if (!areRute) seteazaStatus("Se calculează rutele de azi, poate dura până la un minut…");
                cere("GET", "/api/rute")
                    .then(pl => {
                        deseneazaRute(pl);
                        areRute = true;
                        seteazaStatus(`Actualizat la ${ora()}. Se reîmprospătează singur.`);
                    })
                    .catch(e => seteazaStatus(`Rutele nu s-au putut încărca (${e.message}). Reîncerc în câteva secunde.`, true))
                    .finally(() => { ruteInCurs = false; });
            }
            if (areRute) seteazaStatus(`Actualizat la ${ora()}. Se reîmprospătează singur.`);
        }

        function seteazaStatus(text, eroare = false) {
            const s = document.getElementById("status");
            s.textContent = text;
            s.classList.toggle("eroare", eroare);
        }

        const buton = document.getElementById("planifica");
        buton.onclick = async () => {
            buton.disabled = true;
            seteazaStatus("Se calculează rutele, durează câteva secunde…");
            try {
                await actualizeaza(await cere("POST", "/api/rute/planifica"));
                seteazaStatus("Rutele de azi sunt planificate.");
            } catch (e) {
                seteazaStatus(`Rutele nu s-au putut calcula (${e.message}). Verifică dacă serverul de rutare rulează.`, true);
            } finally {
                buton.disabled = false;
            }
        };

        function porneste() {
            if (document.querySelector(".leaflet-popup")) return;   // nu inchidem popup-ul pe care il citeste cineva
            actualizeaza().catch(e =>
                seteazaStatus(`Nu primesc date de la server (${e.message}). Reîncerc în câteva secunde.`, true));
        }

        document.getElementById("azi").textContent = "Timișoara, " +
            new Date().toLocaleDateString("ro-RO", { weekday: "long", day: "numeric", month: "long" });
        porneste();
        setInterval(porneste, REIMPROSPATARE_MS);
    </script>
</body>

</html>
